services:
  gluetun:
    image: qmcgaw/gluetun:v3.40.0
    container_name: gluetun
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - OPENVPN_USER=${NORD_USER}
      - OPENVPN_PASSWORD=${NORD_PASS}
      # Exit-Land (seit 2026-09-02: Niederlande). Ueber die deutschen Exits kamen
      # ab Ende August keine gueltigen Tile-Antworten mehr an (HTML statt MVT),
      # und die Berliner Server (194.233.96.x) sind von Hetzner aus nicht
      # erreichbar (Routing, 100 % Paketverlust). Die niederlaendischen Server
      # sind vollstaendig erreichbar; fuer Mapillary ist das Exit-Land egal.
      - SERVER_COUNTRIES=Netherlands
    volumes:
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9999/v1/openvpn/status"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mapillary-ts_worker:
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy

  mapillary-mk_worker:
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
