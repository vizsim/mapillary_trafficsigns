[project]
name = "mapillary-trafficsigns"
version = "0.1.0"
description = "Mapillary traffic sign and road marking detections for Germany, and the campaigns built on them"
requires-python = ">=3.12,<3.13"
# Direct dependencies only - everything else is pinned in uv.lock. This one
# environment serves the weekly worker (docker/Dockerfile.worker), the campaign
# notebooks and the tests.
dependencies = [
    "fiona==1.10.1",
    "folium==0.20.0",
    "geopandas==1.1.1",
    "ipykernel==6.30.0",
    "jupyter-client==8.6.3",
    "jupyter-core==5.8.1",
    "mapillary==1.0.15",
    "matplotlib==3.10.5",
    "mercantile==1.2.1",
    "nbconvert==7.16.4",
    "numpy==2.3.2",
    "osm2geojson==0.3.1",
    "pandas==2.3.1",
    "pyarrow==21.0.0",
    "pyogrio==0.11.1",
    "requests==2.32.4",
    "seaborn==0.13.2",
    "shapely==2.1.1",
    "tqdm==4.67.1",
    "urllib3==2.5.0",
    "vt2geojson==0.2.1",
]

[dependency-groups]
dev = [
    "nbstripout==0.9.1",
    "pytest==9.1.1",
]

[tool.uv]
# Not an installable package: scripts, modules and notebooks run from the repo.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "use_cases"]
