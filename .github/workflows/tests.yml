# Runs the tests on every push to main and on pull requests.
#
# One environment for everything since #9: pyproject.toml + uv.lock in the repo
# root, the same lock file the worker image installs from. No test needs the
# network, credentials or the gitignored data in output/.
#
# The worker's deploy step (scripts/run_worker_with_vpn.sh) only rolls out a
# commit whose check runs here all succeeded.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tags, hence the exact version.
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Install from uv.lock
        run: uv sync --frozen
      - name: Run tests
        run: uv run --frozen pytest
